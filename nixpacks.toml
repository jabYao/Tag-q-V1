# Tag q — Monolito Laravel + Vite (Blade + Livewire) — Railway/Nixpacks
# AGENTS.md §2: monolito SSR, un solo proceso Laravel, PostgreSQL, Cloudinary, Vite como bundler
#
# IMPORTANTE: NO declarar `php` en [phases.setup].nixPkgs. El proveedor PHP de Nixpacks
# elige la versión leyendo el `require.php` de composer.json (^8.4.1 -> php84). Si se
# agrega el paquete `php` genérico, se instala el PHP por defecto del canal (8.3) y
# composer install falla porque el lock exige php >=8.4.1.
#
# Tampoco se declara `providers`: se detectan solos por composer.json (PHP) y package.json (Node).
# Y si se declara, debe ser una lista (providers = ["php", "node"]), nunca una tabla.

[variables]
# Laravel sirve desde public/. Sin esto el server root es /app y la app no responde.
NIXPACKS_PHP_ROOT_DIR = "/app/public"

[phases.build]
# Vite/Tailwind: sin esto no existe public/build/manifest.json y las vistas @vite fallan.
cmds = ["npm run build"]

[start]
# Railway inyecta $PORT. Healthcheck en /up (definido en bootstrap/app.php).
# migrate --force mantiene enum/check de orders y el esquema al día en cada deploy.
cmd = "php artisan migrate --force && php artisan config:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
