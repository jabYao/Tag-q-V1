# Tag q — Monolito Laravel + Vite (Blade + Livewire) — Railway/Nixpacks
# AGENTS.md §2: monolito SSR, un solo proceso Laravel, PostgreSQL, Cloudinary, Vite solo como bundler

[providers]
# Nixpacks detecta php y node automáticamente via composer.json + package.json
# No forzar provider para que respete php ^8.3 de composer.json

[phases.setup]
nixPkgs = ["php", "phpPackages.composer", "nodejs_20", "postgresql"]

[phases.install]
# Nixpacks ya hace composer install + npm ci, pero lo dejamos explícito para cache óptimo
cmds = ["composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader", "npm ci"]

[phases.build]
cmds = ["npm run build", "php artisan config:clear"]

[start]
# Railway inyecta $PORT. Healthcheck en /up (definido en bootstrap/app.php)
# migrate --force es seguro con PostgreSQL y mantiene enum/check de orders status
cmd = "php artisan migrate --force && php artisan config:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
